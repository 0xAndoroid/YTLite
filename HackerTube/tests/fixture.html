<script>
// The two click handlers of hackertube.org's page as of 2026-11-14: a capture-phase handler for
// the Watch later button inside a card, and a document-level handler that follows same-site links
// with history.pushState unless the event's default was prevented.
window.routed = [];
window.later = 0;
document.addEventListener("click", (e) => {
  const b = e.target instanceof Element && e.target.closest("[data-later]");
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  window.later++;
}, true);
document.addEventListener("click", (e) => {
  const a = e.target instanceof Element && e.target.closest("a[href^='/']");
  if (!a || a.target || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  history.pushState(null, "", a.getAttribute("href"));
  window.routed.push(a.getAttribute("href"));
});
</script>
