name: Build packages

on:
  pull_request:
    paths:
      - 'Unlock521/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      enable_youpip: false
      enable_ytuhd: false
      enable_yq: false
      enable_ryd: false
      enable_ytabc: false
      enable_demc: false
      enable_localization: false
      tweak_version: '6.0'
