name: Noise Filter

on:
  pull_request:
    branches: ['noise-filter']
    paths:
      - 'NoiseFilter/**'
      - '.github/workflows/noise-filter.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Contract and service fixtures
        run: sh NoiseFilter/tests/check.sh
      - name: UIKit fixtures
        run: uv run --no-project python NoiseFilter/tests/run-uikit.py "$RUNNER_TEMP/noise-filter"
      - name: Build only the companion
        run: make -f NoiseFilter/Native.mk BUILD="$RUNNER_TEMP/noise-filter"
      - uses: actions/upload-artifact@v7
        with:
          name: noise-filter-companion
          path: |
            ${{ runner.temp }}/noise-filter/NoiseFilter.dylib
            ${{ runner.temp }}/noise-filter/*.png
            ${{ runner.temp }}/noise-filter/uikit.log
