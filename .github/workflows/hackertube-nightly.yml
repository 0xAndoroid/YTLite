name: HackerTube nightly

on:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - id: select
        name: Check for a new commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          actions="repos/$GITHUB_REPOSITORY/actions"
          workflow="${GITHUB_WORKFLOW_REF%%@*}"
          cutoff=$(gh api "$actions/runs/$GITHUB_RUN_ID" |
            jq -er '.created_at | select((fromdateiso8601 | todateiso8601) == .)') || cutoff=
          run=true
          if [[ -n "$cutoff" ]]; then
            run=$(gh api --method GET "$actions/workflows/${workflow##*/}/runs" \
              -f "branch=$GITHUB_REF_NAME" -f event=schedule -f status=completed \
              -f "created=<$cutoff" -f per_page=20 |
              jq -r --arg cutoff "$cutoff" --arg sha "$GITHUB_SHA" \
                --argjson id "$GITHUB_RUN_ID" --argjson number "$GITHUB_RUN_NUMBER" '
                [.workflow_runs | arrays[]
                  | if (.conclusion | type) != "string" then error("Invalid run conclusion") else . end
                  | select(.conclusion == "success" or .conclusion == "failure")
                  | if ([.id, .run_number] | all(type == "number" and . > 0 and . == floor))
                    and (.updated_at | (fromdateiso8601 | todateiso8601) == .)
                    then . else error("Invalid run identity or completion timestamp") end
                  | select(.id != $id and .run_number < $number and .updated_at < $cutoff)]
                | max_by([.updated_at, .run_number]).head_sha != $sha') || run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  full:
    needs: preflight
    if: needs.preflight.outputs.run != 'false'
    uses: ./.github/workflows/hackertube.yml
