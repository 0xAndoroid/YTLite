name: HackerTube nightly

on:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - id: select
        name: Check for a new commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          actions="repos/$GITHUB_REPOSITORY/actions"
          workflow="${GITHUB_WORKFLOW_REF%%@*}"
          cutoff=$(gh api "$actions/runs/$GITHUB_RUN_ID" --jq '.created_at // empty') || cutoff=
          previous=
          if [[ -n "$cutoff" ]]; then
            previous=$(gh api --method GET "$actions/workflows/${workflow##*/}/runs" \
              -f "branch=$GITHUB_REF_NAME" -f event=schedule -f status=completed \
              -f "created=<$cutoff" -f per_page=20 |
              jq -r --arg cutoff "$cutoff" --argjson id "$GITHUB_RUN_ID" --argjson number "$GITHUB_RUN_NUMBER" '
                ($cutoff | fromdateiso8601) as $before
                | [.workflow_runs[]
                  | select(.conclusion == "success" or .conclusion == "failure")
                  | if ([.id, .run_number] | all(type == "number" and . > 0 and . == floor))
                    then .updated_at |= fromdateiso8601 else error("Invalid run identity") end
                  | select(.id != $id and .run_number < $number and .updated_at < $before)]
                | max_by([.updated_at, .run_number]).head_sha // empty') || previous=
          fi
          if [[ -n "$previous" && "$previous" == "$GITHUB_SHA" ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  full:
    needs: preflight
    if: needs.preflight.outputs.run != 'false'
    uses: ./.github/workflows/hackertube.yml
