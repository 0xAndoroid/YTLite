name: HackerTube

on:
  pull_request:
    paths:
      - 'HackerTube/**'
      - '!HackerTube/**/*.md'
      - '.github/workflows/hackertube.yml'
      - '.github/workflows/hackertube-nightly.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check fixture runner syntax
        run: python3 -m py_compile HackerTube/tests/run.py
      - name: Build the companion
        run: make -C HackerTube BUILD="$RUNNER_TEMP/hackertube"
      - name: Home-to-watch smoke
        if: github.event_name == 'pull_request'
        run: python3 HackerTube/tests/run.py "$RUNNER_TEMP/hackertube" --smoke
      - name: Full simulator checks
        if: github.event_name != 'pull_request'
        run: python3 HackerTube/tests/run.py "$RUNNER_TEMP/hackertube"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hackertube
          path: |
            ${{ runner.temp }}/hackertube/HackerTube.dylib
            ${{ runner.temp }}/hackertube/checks.log
          if-no-files-found: ignore
