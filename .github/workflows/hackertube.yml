name: HackerTube

on:
  pull_request:
    paths:
      - 'HackerTube/**'
      - '!HackerTube/**/*.md'
      - '.github/workflows/hackertube.yml'
      - '.github/workflows/hackertube-nightly.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check test and preflight script syntax
        run: python3 -m py_compile HackerTube/tests/run.py HackerTube/tests/select-nightly.py
      - name: Build the companion
        run: make -C HackerTube BUILD="$RUNNER_TEMP/hackertube"
      - name: Home-to-watch smoke
        if: github.event_name == 'pull_request'
        run: python3 HackerTube/tests/run.py "$RUNNER_TEMP/hackertube" --smoke
      - name: Full simulator checks
        if: github.event_name != 'pull_request'
        run: python3 HackerTube/tests/run.py "$RUNNER_TEMP/hackertube"
      - name: Both full fixture launches reached a result
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          lines = (Path(os.environ['RUNNER_TEMP']) / 'hackertube/checks.log').read_text().splitlines()
          for state in ('off', 'on'):
              if not any(f'HackerTube checks with the switch {state}: {result}' in lines
                         for result in ('PASS', 'FAIL')):
                  raise SystemExit(f'No fixture result with the switch {state}')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hackertube
          path: |
            ${{ runner.temp }}/hackertube/HackerTube.dylib
            ${{ runner.temp }}/hackertube/checks.log
          if-no-files-found: ignore
